    universe: 30
    expect: { allowed: [bullish, neutral, abstain] }

  - id: held-big-loss-down
    note: 保有中・含み損大・下降トレンド・悪材料 → 強気はおかしい
    row: { ticker: X210, name: 架空海運, sector: shipping, close: 2100, atr: 90, momentum: -0.28, relStrength: -0.20, vol: 0.45, trend: down, ret20: -0.12, fromHigh52: -0.45 }
    rank: 28
    universe: 30
    held: { entryPrice: 2700, daysHeld: 35 }
    events:
      - { date: "2025-12-19", eventType: dividend_cut, direction: -2, materiality: 3, evidence: "期末配当予想を1株当たり40円から無配に修正" }
    expect: { allowed: [bearish, neutral, abstain] }

  - id: held-profit-up
    note: 保有中・含み益・上昇トレンド継続 → 弱気はおかしい
    row: { ticker: X211, name: 架空機械, sector: machinery, close: 3600, atr: 75, momentum: 0.38, relStrength: 0.12, vol: 0.26, trend: up, ret20: 0.04, fromHigh52: -0.03 }
    rank: 3
    universe: 30
    held: { entryPrice: 3000, daysHeld: 40 }
    expect: { allowed: [bullish, neutral, abstain] }

  - id: mixed-news
    note: 好材料と悪材料が混在、方向感なし → 中立か棄権
    row: { ticker: X212, name: 架空電子, sector: electronics, close: 5200, atr: 110, momentum: 0.05, relStrength: 0.0, vol: 0.30, trend: flat, ret20: 0.01, fromHigh52: -0.15 }
    rank: 14
    universe: 30
    events:
      - { date: "2025-12-10", eventType: earnings_beat, direction: 1, materiality: 2, evidence: "営業利益は前年同期比42%増の130億円" }
      - { date: "2025-12-24", eventType: analyst_downgrade, direction: -1, materiality: 2, evidence: "投資判断を「買い」から「中立」に引き下げた" }
    expect: { allowed: [neutral, abstain] }

  - id: down-trend-dilution
    note: 下降トレンド + 大型増資 → 強気はおかしい
    row: { ticker: X213, name: 架空不動産, sector: real_estate, close: 900, atr: 28, momentum: -0.15, relStrength: -0.09, vol: 0.32, trend: down, ret20: -0.11, fromHigh52: -0.33 }
    rank: 26
    universe: 30
    events:
      - { date: "2025-12-27", eventType: dilution, direction: -2, materiality: 3, evidence: "公募による新株式発行2,000万株（発行済株式総数の15.0%）" }
    expect: { allowed: [bearish, neutral, abstain] }

  - id: up-trend-minor-positive
    note: 上昇トレンド + 小さな好材料 → 弱気はおかしい
    row: { ticker: X214, name: 架空ゴム, sector: materials, close: 2300, atr: 40, momentum: 0.22, relStrength: 0.06, vol: 0.22, trend: up, ret20: 0.03, fromHigh52: -0.05 }
    rank: 5
    universe: 30
    events:
      - { date: "2025-12-15", eventType: analyst_upgrade, direction: 1, materiality: 1, evidence: "投資判断を「中立」から「買い」に引き上げた" }
    expect: { allowed: [bullish, neutral, abstain] }
