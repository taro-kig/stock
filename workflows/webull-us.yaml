name: webull-us
description: "ウィブル証券で米国株: AI 判断 → リスク制限 → 人の承認 → Webull に指値注文。既定 (trading: dry_run) では Webull のプレビューのみで発注しない。config の webull.market: us が必要。"
nodes:
  # ── information (English news + SEC filings) ─────────────────
  news:       { use: source.rss, onError: skip, ui: { x: 0, y: 0 } }
  filings:    { use: source.secFilings, onError: skip, ui: { x: 0, y: 110 } }
  merge:      { use: filter.merge, in: { a: news, b: filings }, ui: { x: 260, y: 50 } }
  dedup:      { use: filter.dedup, in: { docs: merge }, onError: skip, ui: { x: 520, y: 50 } }
  match:      { use: filter.watchlist, in: { docs: dedup }, onError: skip, ui: { x: 780, y: 50 } }
  extract:    { use: llm.extractEvents, in: { matches: match }, onError: fallback, ui: { x: 1040, y: 50 } }
  history:    { use: signal.eventHistory, in: { today: extract }, ui: { x: 1300, y: 50 } }
  eventScore: { use: signal.eventScores, in: { events: history }, ui: { x: 1560, y: 50 } }
  # ── prices & factors (no LLM) ────────────────────────────────
  prices:     { use: data.pricesTwelveData, ui: { x: 0, y: 280 } }
  factors:    { use: signal.factors, in: { prices: prices }, ui: { x: 260, y: 280 } }
  earnings:   { use: data.earnings, onError: skip, ui: { x: 0, y: 500 } }
  insider:    { use: data.insider, onError: skip, ui: { x: 0, y: 390 } }
  score:      { use: signal.score, in: { factors: factors, events: eventScore, insider: insider }, ui: { x: 1820, y: 160 } }
  account:    { use: portfolio.webullAccount, in: { prices: prices }, ui: { x: 260, y: 500 } }
  # ── decision → hard limits → approval → execution ────────────
  decide:     { use: decide.ai, in: { factors: factors, scores: score, events: history, account: account, earnings: earnings, insider: insider }, onError: fallback, ui: { x: 2080, y: 280 } }
  propose:    { use: portfolio.propose, in: { judgments: decide, factors: factors, account: account, earnings: earnings }, ui: { x: 2340, y: 280 } }
  approve:    { use: gate.approval, in: { proposals: propose }, params: { mode: manual }, ui: { x: 2600, y: 280 } }
  execute:    { use: broker.webull, in: { proposals: approve, prices: prices, account: account }, ui: { x: 2860, y: 280 } }
  # ── grading (確度の答え合わせ) ──────────────────────────────────
  record:     { use: eval.record, in: { judgments: decide }, ui: { x: 2340, y: 500 } }
  grade:      { use: eval.scorecard, in: { prices: prices }, params: { baselineLabel: daily-rules }, after: [record], ui: { x: 2600, y: 500 } }
