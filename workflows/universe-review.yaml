name: universe-review
description: "米国株のウォッチリスト見直し（週1回動き、提案は28日に1回）: 追加候補はデータ（SEC の財務・規模と株価、小型株も）で探し、足りなければ AI にも聞く。削除候補は売買代金・データ・ニュース・判断から。人が承認したら config.yaml に反映。"
nodes:
  prices: { use: data.pricesTwelveData, ui: { x: 0, y: 0 } }
  # source: screen = データで探す / ai = テーマで AI に聞く / both = データで探し、足りなければ AI。
  # screen: 規模 sizes [large, mid, small]・業種 sectors・minRevenueGrowth・minOperatingMargin など。
  # themes（AI 用）: 空なら「今のセクターの偏りを補う」。例: [サイバーセキュリティ, 高配当・連続増配]
  review: { use: universe.review, in: { prices: prices }, params: { addCount: 5, maxRemove: 3, minDaysBetween: 28, source: both, screen: { sizes: [large, mid, small] } }, ui: { x: 260, y: 0 } }
  apply:  { use: universe.apply, in: { changes: review }, params: { mode: manual }, ui: { x: 520, y: 0 } }
