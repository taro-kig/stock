# Copy to config/config.yaml (git-ignored) and edit. API keys come from environment variables only.
dataDir: data

harness:
  dailyBudgetUsd: 0.5   # H5: hard daily cap for all LLM calls
  quorum: 2             # H3: votes needed to accept an output
  maxRetries: 2         # H1: re-asks on invalid JSON / schema errors

# Cheap models from *different vendors* (uncorrelated errors). Model ids and prices change often.
models:
  tier1:
    - { name: gemini-lite, provider: gemini, model: gemini-2.5-flash-lite, apiKeyEnv: GEMINI_API_KEY }
    - { name: deepseek, provider: openai_compat, baseUrl: "https://api.deepseek.com/v1", model: deepseek-chat, apiKeyEnv: DEEPSEEK_API_KEY }
    # A 3rd member enables 2-of-3 voting; it is only called when the first two disagree.
    # - { name: qwen, provider: openai_compat, baseUrl: "https://openrouter.ai/api/v1", model: qwen/qwen-2.5-72b-instruct, apiKeyEnv: OPENROUTER_API_KEY }
  tier2: { name: gemini-flash, provider: gemini, model: gemini-2.5-flash, apiKeyEnv: GEMINI_API_KEY }
  # redTeam defaults to tier2 when omitted.

# USD per 1M tokens [input, output]. ASSUMED values — verify. Unlisted models are charged a pessimistic price.
pricing:
  gemini-2.5-flash-lite: [0.10, 0.40]
  gemini-2.5-flash: [0.30, 2.50]
  deepseek-chat: [0.27, 1.10]

sources:
  - { name: google_news_jp_kessan, url: "https://news.google.com/rss/search?q=%E6%B1%BA%E7%AE%97+%E4%B8%8A%E6%96%B9%E4%BF%AE%E6%AD%A3&hl=ja&gl=JP&ceid=JP:ja", weight: 0.8 }

market:
  currency: JPY
  benchmark: "1306"     # TOPIX ETF, used for relative strength, regime filter and grading

watchlist:
  "7203": { name: トヨタ自動車, aliases: [トヨタ, Toyota], sector: auto }
  "7267": { name: 本田技研工業, aliases: [ホンダ, Honda], sector: auto }
  "6758": { name: ソニーグループ, aliases: [ソニー, Sony], sector: electronics }
  "6861": { name: キーエンス, aliases: [Keyence], sector: electronics }
  "8306": { name: 三菱UFJフィナンシャル・グループ, aliases: [三菱UFJ, MUFG], sector: bank }
  "9984": { name: ソフトバンクグループ, aliases: [ソフトバンクG, SoftBank Group], sector: telecom }

risk:
  riskPerTrade: 0.0075
  stopAtrMult: 2.5
  maxWeight: 0.15
  maxPositions: 6
  maxSectorWeight: 0.35
  lotSize: 100
