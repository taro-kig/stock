# 米国株用の例（既定）。config/config.yaml (git 管理外) にコピーして編集する。日本株は config.jp.example.yaml。
# API キーは Web UI の「7 設定」画面（または CLI の `stockai settings set NAME`）で入れる。
#   GEMINI_API_KEY / DEEPSEEK_API_KEY  … LLM
#   TWELVEDATA_API_KEY                 … 米国株の日足（無料プラン: 800 回/日, 8 回/分）
#   SEC_USER_AGENT                     … SEC EDGAR の利用条件で必須: "stockai you@example.com"
#   ALPHAVANTAGE_API_KEY               … 決算予定（任意。無料キー、1日1回だけ使う）
dataDir: data

harness:
  dailyBudgetUsd: 0.5   # H5: hard daily cap for all LLM calls
  quorum: 2             # H3: votes needed to accept an output
  maxRetries: 2         # H1: re-asks on invalid JSON / schema errors

# Models (settings screen → モデル: vendor, model id, price, test). Names are what `use` and workflow nodes refer to.
# Model ids and prices change often.
models:
  pool:
    - { name: gemini-lite, provider: gemini, model: gemini-2.5-flash-lite, apiKeyEnv: GEMINI_API_KEY }
    - { name: deepseek, provider: openai_compat, baseUrl: "https://api.deepseek.com/v1", model: deepseek-chat, apiKeyEnv: DEEPSEEK_API_KEY }
    - { name: gemini-flash, provider: gemini, model: gemini-2.5-flash, apiKeyEnv: GEMINI_API_KEY }
    # - { name: qwen, provider: openai_compat, baseUrl: "https://openrouter.ai/api/v1", model: qwen/qwen-2.5-72b-instruct, apiKeyEnv: OPENROUTER_API_KEY }
  # Which model does what. auto (default): the app picks from the models above that have a key —
  # the cheapest model of each vendor answers and only matching answers are used; a pricier one settles
  # important disagreements. To choose by hand: prompts screen → 使うモデル (or a workflow node's params).
  use: { event: auto, judge: auto, redteam: auto, universe: auto }

# Prompt versions (docs/prompts.md). event-us-v1 reads English filings / news (8-K items, consensus, guidance).
prompts:
  event: event-us-v1
  judge: judge-v1
  redTeam: redteam-v1

# USD per 1M tokens [input, output]. ASSUMED values — verify. Unlisted models are charged a pessimistic price.
pricing:
  gemini-2.5-flash-lite: [0.10, 0.40]
  gemini-2.5-flash: [0.30, 2.50]
  deepseek-chat: [0.27, 1.10]

# English news feeds (in addition to SEC filings, which source.secFilings reads directly).
# Feed URLs are third-party and may change; a failing feed is skipped. {tickers} becomes the watchlist (comma-separated).
sources:
  - { name: yahoo_finance, url: "https://feeds.finance.yahoo.com/rss/2.0/headline?s={tickers}&region=US&lang=en-US", weight: 0.7 }
  - { name: google_news_us_guidance, url: "https://news.google.com/rss/search?q=raises+OR+cuts+guidance+outlook&hl=en-US&gl=US&ceid=US:en", weight: 0.6 }

market:
  currency: USD
  benchmark: SPY        # S&P 500 ETF, used for relative strength, regime filter and grading

# name is matched against news text (whole words); aliases add other spellings.
watchlist:
  AAPL:  { name: Apple, aliases: [Apple Inc], sector: tech }
  MSFT:  { name: Microsoft, sector: tech }
  NVDA:  { name: NVIDIA, aliases: [Nvidia], sector: semis }
  AMZN:  { name: Amazon, aliases: [Amazon.com], sector: consumer }
  GOOGL: { name: Alphabet, aliases: [Google], sector: communication }
  META:  { name: Meta Platforms, aliases: [Facebook], sector: communication }
  JPM:   { name: JPMorgan Chase, aliases: [JPMorgan, JP Morgan], sector: financials }
  XOM:   { name: Exxon Mobil, aliases: [ExxonMobil, Exxon], sector: energy }
  UNH:   { name: UnitedHealth, aliases: [UnitedHealth Group], sector: healthcare }
  COST:  { name: Costco, aliases: [Costco Wholesale], sector: staples }
  LLY:   { name: Eli Lilly, aliases: [Lilly], sector: healthcare }

risk:
  riskPerTrade: 0.0075
  stopAtrMult: 2.5
  maxWeight: 0.15
  maxPositions: 6
  maxSectorWeight: 0.35
  lotSize: 1             # US shares trade in single shares

# Interactive Brokers via IB Gateway (docs/ibkr.md). Used by workflows/ibkr-paper.yaml.
ibkr:
  host: 127.0.0.1
  port: 4002              # IB Gateway: 4002 = paper, 4001 = live
  clientId: 17
  mode: paper             # live additionally needs accountId + STOCKAI_LIVE_TRADING=yes-i-understand
  market: us              # SMART routing, USD
  limitOffsetBps: 50
  maxOrderValue: 20000    # hard cap per buy order (USD)
  maxOrdersPerRun: 6

# Webull Japan OpenAPI (docs/webull.md). Used by workflows/webull-us.yaml.
webull:
  trading: dry_run          # dry_run: Webull only previews orders (nothing placed)
  # accountId: "..."        # recommended; required for live
  accountTaxType: SPECIFIC  # 特定口座 = SPECIFIC, 一般口座 = GENERAL
  market: us
  limitOffsetBps: 50
  maxOrderValue: 20000
  maxOrdersPerRun: 6

# Discord notifications. Put the webhook URL on the settings screen (DISCORD_WEBHOOK_URL), then press "テスト送信".
# events: approval (waiting for approval) · failure (failed / partly failed run) · orders (broker orders)
#         fills (paper fills) · success (every successful run) · backup (backup failed)
notify:
  # also: fills (paper fills), success (every run). market: risk level changed · stops: a holding at / near its stop ·
  # earnings: a holding reports today or tomorrow · stale: a data source not updated for longer than usual
  events: [approval, failure, orders, backup, market, stops, earnings, stale]
  baseUrl: "http://127.0.0.1:4317"   # links in notifications

# Daily database backup while the web server is up (the record of judgments cannot be recreated).
backup:
  at: "12:30"
  # dir: "D:/stockai-backups"   # another disk or a synced folder survives a disk failure (default: <dataDir>/backups)
  keepDaily: 14
  keepMonthly: 12
  includeSettings: false        # true also copies settings.sqlite (API keys, plain text)

# Automatic daily runs while the web server is up (`npm run web`). Server local time.
# The US close is 05:00 (summer) / 06:00 (winter) JST, so these run the next morning in Japan,
# Tuesday–Saturday. The run date is the UTC date, i.e. the US trading day just closed.
# Runs whose run date is a US market holiday are skipped (skipHolidays: true by default).
schedule:
  - { workflow: workflows/daily-rules.yaml, at: "06:40", days: [2, 3, 4, 5, 6] }
  - { workflow: workflows/daily-ai.yaml, at: "06:45", days: [2, 3, 4, 5, 6] }
  # Watchlist review: runs every Saturday, proposes at most every 28 days, waits for approval.
  - { workflow: workflows/universe-review.yaml, at: "10:10", days: [6] }
  # Factor research (no LLM): how well each scoring factor predicted, on ~110 large US stocks. Results: 4 確度 → 因子の検証.
  - { workflow: workflows/factor-research.yaml, at: "11:20", days: [6] }
