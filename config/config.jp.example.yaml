# 日本株用の例。config/config.yaml (git 管理外) にコピーして編集する。
# API キーは Web UI の「7 設定」画面（または CLI の stockai settings set）で入れる。
# 米国株と記録を混ぜないよう dataDir を分けている。
dataDir: data/jp

harness:
  dailyBudgetUsd: 0.5   # H5: hard daily cap for all LLM calls
  quorum: 2             # H3: votes needed to accept an output
  maxRetries: 2         # H1: re-asks on invalid JSON / schema errors

# Models (settings screen → モデル: vendor, model id, price, test). Names are what `use` and workflow nodes refer to.
# Model ids and prices change often.
models:
  pool:
    - { name: gemini-lite, provider: gemini, model: gemini-2.5-flash-lite, apiKeyEnv: GEMINI_API_KEY }
    - { name: deepseek, provider: openai_compat, baseUrl: "https://api.deepseek.com/v1", model: deepseek-chat, apiKeyEnv: DEEPSEEK_API_KEY }
    - { name: gemini-flash, provider: gemini, model: gemini-2.5-flash, apiKeyEnv: GEMINI_API_KEY }
    # - { name: qwen, provider: openai_compat, baseUrl: "https://openrouter.ai/api/v1", model: qwen/qwen-2.5-72b-instruct, apiKeyEnv: OPENROUTER_API_KEY }
  # Which model does what. auto (default): the app picks from the models above that have a key —
  # the cheapest model of each vendor answers and only matching answers are used; a pricier one settles
  # important disagreements. To choose by hand: prompts screen → 使うモデル (or a workflow node's params).
  use: { event: auto, judge: auto, redteam: auto, universe: auto }

# Prompt versions (docs/prompts.md). Compare with `stockai eval events|judge` before switching.
prompts:
  event: event-v1
  judge: judge-v1
  redTeam: redteam-v1

# USD per 1M tokens [input, output]. ASSUMED values — verify. Unlisted models are charged a pessimistic price.
pricing:
  gemini-2.5-flash-lite: [0.10, 0.40]
  gemini-2.5-flash: [0.30, 2.50]
  deepseek-chat: [0.27, 1.10]

sources:
  - { name: google_news_jp_kessan, url: "https://news.google.com/rss/search?q=%E6%B1%BA%E7%AE%97+%E4%B8%8A%E6%96%B9%E4%BF%AE%E6%AD%A3&hl=ja&gl=JP&ceid=JP:ja", weight: 0.8, market: jp }

market:
  currency: JPY
  benchmark: "1306"     # TOPIX ETF, used for relative strength, regime filter and grading

# US and Japanese stocks can share one watchlist: codes like 7203 / 130A are Japanese, the rest US
# (or set `market: us|jp` on an entry). US workflows (daily-ai, ibkr-paper, …) see only the US stocks,
# daily-jp-* only the Japanese ones; each has its own account and currency. Per-market settings (defaults shown):
# markets:
#   us: { benchmark: SPY, lotSize: 1 }
#   jp: { benchmark: "1306", lotSize: 100 }

watchlist:
  "7203": { name: トヨタ自動車, aliases: [トヨタ, Toyota], sector: auto }
  "7267": { name: 本田技研工業, aliases: [ホンダ, Honda], sector: auto }
  "6758": { name: ソニーグループ, aliases: [ソニー, Sony], sector: electronics }
  "6861": { name: キーエンス, aliases: [Keyence], sector: electronics }
  "8306": { name: 三菱UFJフィナンシャル・グループ, aliases: [三菱UFJ, MUFG], sector: bank }
  "9984": { name: ソフトバンクグループ, aliases: [ソフトバンクG, SoftBank Group], sector: telecom }

risk:
  riskPerTrade: 0.0075
  stopAtrMult: 2.5
  maxWeight: 0.15
  maxPositions: 6
  maxSectorWeight: 0.35
  lotSize: 100

# Interactive Brokers via IB Gateway (docs/ibkr.md). Used by workflows/ibkr-paper.yaml.
ibkr:
  host: 127.0.0.1
  port: 4002              # IB Gateway: 4002 = paper, 4001 = live
  clientId: 17
  mode: paper             # live additionally needs accountId + STOCKAI_LIVE_TRADING=yes-i-understand
  # accountId: DU1234567  # recommended: refuses to run if the gateway is logged into another account
  market: jp              # jp -> TSEJ/JPY, us -> SMART/USD (per-ticker overrides under `contracts`)
  limitOffsetBps: 50      # buy limit = close +0.5%, sell limit = close -0.5%, rounded to the tick grid
  maxOrderValue: 2000000  # hard cap per buy order (account currency)
  maxOrdersPerRun: 6

# Webull Japan OpenAPI (docs/webull.md). Used by workflows/webull-jp.yaml.
# Credentials come from WEBULL_APP_KEY / WEBULL_APP_SECRET; approve access once with `stockai webull auth`.
webull:
  trading: dry_run          # dry_run: Webull only previews orders (nothing placed). live: real orders
                            #          (live also needs accountId + STOCKAI_LIVE_TRADING=yes-i-understand)
  # accountId: "..."        # recommended; required for live
  accountTaxType: SPECIFIC  # 特定口座 = SPECIFIC, 一般口座 = GENERAL (required by Webull JP)
  market: jp
  limitOffsetBps: 50
  maxOrderValue: 2000000
  maxOrdersPerRun: 6

# Discord notifications. Put the webhook URL on the settings screen (DISCORD_WEBHOOK_URL), then press "テスト送信".
# events: approval (waiting for approval) · failure (failed / partly failed run) · orders (broker orders)
#         fills (paper fills) · success (every successful run) · backup (backup failed)
notify:
  # also: fills (paper fills), success (every run). market: risk level changed · stops: a holding at / near its stop ·
  # earnings: a holding reports today or tomorrow · stale: a data source not updated for longer than usual
  events: [approval, failure, orders, backup, market, stops, earnings, stale]
  baseUrl: "http://127.0.0.1:4317"   # links in notifications

# Daily database backup while the web server is up (the record of judgments cannot be recreated).
backup:
  at: "12:30"
  # dir: "D:/stockai-backups"   # another disk or a synced folder survives a disk failure (default: <dataDir>/backups)
  keepDaily: 14
  keepMonthly: 12
  includeSettings: false        # true also copies settings.sqlite (API keys, plain text)

# Automatic daily runs while the web server is up (`npm run web`). Server local time.
# The baseline runs first so the AI workflow reuses its cached nodes.
schedule:
  - { workflow: workflows/daily-jp-rules.yaml, at: "16:30" }
  - { workflow: workflows/daily-jp-ai.yaml, at: "16:35" }
