---
# aqua - Declarative CLI Version Manager
# https://aquaproj.github.io/
# Install the pinned tools with:  aqua i -l   (see README "セットアップ")
checksum:
  enabled: true
  require_checksum: true
  supported_envs:
    - darwin
    - linux
registries:
  - type: standard
    ref: v4.580.0 # renovate: depName=aquaproj/aqua-registry
packages:
  - name: nodejs/node@v22.23.4 # Node.js (includes npm). Tested version; engines in package.json require >=22.18
